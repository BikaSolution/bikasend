repos:
  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: '\.(woff2|png|ico|webp)$'
      - id: trailing-whitespace
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["-b", "main", "-b", "master"]
  - repo: "https://github.com/golangci/golangci-lint"
    rev: v2.15.0
    hooks:
      - id: golangci-lint
  - repo: local
    hooks:
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        files: \.go$
        pass_filenames: false
      - id: go-arch-lint
        name: Architecture boundaries (go-arch-lint)
        entry: make arch_lint
        language: system
        files: '(\.go$|^\.go-arch-lint\.yml$)'
        pass_filenames: false
