# Monthly security audit, even when nothing changed: new CVEs appear in old code.
# Uses the latest scanners on purpose (see 10-security.md). A failure opens an issue.
name: audit

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Linux webview
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Known vulnerabilities (latest govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags webkit2_41 ./...

      - name: Insecure code patterns (latest gosec)
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -tags webkit2_41 ./...

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Monthly security audit failed" \
            --body "The scheduled audit found a problem. Read the run, fix or triage every finding, then close this issue: $RUN_URL"
